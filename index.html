const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},key,d(DATA));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:d(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
window.addEventListener("load",()=>setTimeout(async()=>{
  try{const s=JSON.parse(localStorage.getItem(KEYNAME)||"null");
    if(s&&s.exp>Date.now()){const k=await crypto.subtle.importKey("raw",d(s.k),"AES-GCM",false,["decrypt"]);await open_(k);return}
    localStorage.removeItem(KEYNAME)}catch(_){try{localStorage.removeItem(KEYNAME)}catch(__){}}
},0));
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const err=document.getElementById("err");err.textContent="確認中…";
  try{
    const key=await derive(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){
      try{const raw=await crypto.subtle.exportKey("raw",key);
        localStorage.setItem(KEYNAME,JSON.stringify({k:e64(raw),exp:Date.now()+DAYS*864e5}))}catch(_){}
    }
    await open_(key);
  }catch(_){err.textContent="パスワードが違います"}
});
