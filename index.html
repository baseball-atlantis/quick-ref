const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},key,d(DATA));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

}
